name: Destination ingress S2 lane B
on:
  pull_request:
    paths:
      - 'reference_profiles/**'
      - 'tests/test_destination_ingress.py'
      - 'tests/test_protected_destination.py'
      - 'tests/test_wire_budget.py'
      - 'tools/destination_admission*'
      - 'tools/requirements-release.lock'
      - '.github/workflows/destination-ingress.yml'
      - 'docs/workstreams/destination-ingress-hardening.md'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'tests/test_destination_ingress.py'
      - '.github/workflows/destination-ingress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r tools/requirements-release.lock
      - name: Ingress schedule and assertion mutation controls
        run: |
          mkdir -p results
          python -m pytest -q -s tests/test_destination_ingress.py tests/test_wire_budget.py --junitxml=results/ingress.xml > results/ingress.log 2>&1
          cat results/ingress.log
      - name: Existing destination qualification and thirteen mutations
        run: python tools/destination_admission_qualification.py --results-dir results/existing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: destination-ingress-${{ matrix.python }}
          path: results/
          if-no-files-found: error
