# Cross-component suite delegated to its canonical testing repository.
name: Worker 22 paired-request enforcement qualification
'on':
  pull_request:
    paths:
    - tests/test_paired_request_enforcement.py
    - tools/paired_request_enforcement.py
    - tools/import_paired_requests.py
    - scenarios/paired-request-enforcement-matrix.v1.json
    - scenarios/paired-request-enforcement-matrix.v2.json
    - component-lock.json
    - profiles/w7-bounded-v1-component-lock.candidate.json
    - docs/workstreams/paired-request-enforcement-checkpoint.md
    - README.md
    - .github/workflows/paired-request-enforcement.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--paired-request-enforcement.yml@a65c0a30ea8a1b73633e989b55263aa4555a8cc3
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: a65c0a30ea8a1b73633e989b55263aa4555a8cc3
    permissions:
      contents: read
