name: Nonselected remediation full-reference matrix
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remediation-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        batch: [authority, exchange, consumers, registry]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Run bounded candidate batch twice
        env:
          BATCH: ${{ matrix.batch }}
        run: python tools/reference_release.py run --profile profiles/remediation-full-reference-20261015.json --batch "$BATCH" --results-dir "results/remediation-full-$BATCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remediation-full-${{ matrix.batch }}
          path: results/remediation-full-${{ matrix.batch }}/
          if-no-files-found: error
  aggregate:
    needs: qualify-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check aggregate gate behavior
        run: |
          python -m pip install --require-hashes -r tools/requirements-release.lock
          python -m pytest -q tests/test_full_candidate_gate.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: remediation-full-*
          path: candidate-artifacts
      - name: Require all batches and unchanged acceptance matrix
        run: python -m tools.aggregate_full_candidate --profile profiles/remediation-full-reference-20261015.json --artifacts candidate-artifacts --out results/remediation-full-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remediation-full-gate
          path: results/remediation-full-candidate/
          if-no-files-found: error
