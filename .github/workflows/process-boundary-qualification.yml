# Cross-component suite delegated to its canonical testing repository.
name: Process boundary qualification
'on':
  pull_request:
    paths:
    - component-lock.json
    - profiles/w7-bounded-v1-component-lock.candidate.json
    - tests/test_process_boundary_qualification.py
    - tools/process_boundary_qualification.py
    - scenarios/process-boundary-matrix.json
    - docs/workstreams/process-boundary-checkpoint.md
    - examples/process-boundary/**
    - .github/workflows/process-boundary-qualification.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--process-boundary-qualification.yml@f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    permissions:
      contents: read
