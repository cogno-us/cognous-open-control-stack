# Cross-component suite delegated to its canonical testing repository.
name: Optional execution profiles
'on':
  workflow_dispatch: null
  pull_request:
    paths:
    - tools/optional_execution*.py
    - tests/test_optional_execution_profiles.py
    - tests/test_optional_evidence_contract.py
    - tools/verify_optional_evidence.py
    - component-lock.json
    - profiles/w7-bounded-v1-component-lock.candidate.json
    - .github/workflows/optional-execution-profiles.yml
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--optional-execution-profiles.yml@78b3f42c93fa3aef64e2fd2216bbdf545db5b0af
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 78b3f42c93fa3aef64e2fd2216bbdf545db5b0af
    permissions:
      contents: read
