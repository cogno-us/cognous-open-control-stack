name: Workflow policy
on:
  pull_request:
    paths:
      - '.github/**'
      - 'tools/check_workflow_policy.py'
      - 'tools/requirements-workflow-policy.lock'
      - 'tests/test_workflow_policy.py'
      - 'docs/security/workflow-policy-exceptions.json'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'tools/check_workflow_policy.py'
      - 'tools/requirements-workflow-policy.lock'
      - 'tests/test_workflow_policy.py'
      - 'docs/security/workflow-policy-exceptions.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r tools/requirements-workflow-policy.lock
      - name: Workflow policy check (positive, whole repository)
        run: python tools/check_workflow_policy.py
      - name: Workflow policy negative fixtures
        env:
          REQUIRE_PYYAML: '1'
        run: python -m unittest discover -s tests -p 'test_workflow_policy.py' -v
