name: W7 release preflight
on:
  pull_request:
    paths:
      - 'component-lock.json'
      - 'scenarios/w7-claim-test-matrix.json'
      - 'tests/test_w7_release_preflight.py'
      - '.github/workflows/w7-release-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_w7_release_preflight.py' -v
