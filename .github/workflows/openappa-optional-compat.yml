# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA optional compatibility
'on':
  pull_request:
    paths:
    - tools/openappa_compat.py
    - tests/test_openappa_optional_compat.py
    - fixtures/openappa/**
    - docs/integrations/openappa-optional-compatibility.md
    - .github/workflows/openappa-optional-compat.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--openappa-optional-compat.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
