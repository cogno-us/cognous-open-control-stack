# Cross-component suite delegated to its canonical testing repository.
name: OpenAPPA optional compatibility
'on':
  pull_request:
    paths:
    - tools/openappa_compat.py
    - tests/test_openappa_optional_compat.py
    - fixtures/openappa/**
    - docs/integrations/openappa-optional-compatibility.md
    - .github/workflows/openappa-optional-compat.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--openappa-optional-compat.yml@2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    permissions:
      contents: read
