name: OpenAPPA optional compatibility

on:
  pull_request:
    paths:
      - "tools/openappa_compat.py"
      - "tests/test_openappa_optional_compat.py"
      - "fixtures/openappa/**"
      - "docs/integrations/openappa-optional-compatibility.md"
      - ".github/workflows/openappa-optional-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3'
      - name: Run W4 optional compatibility qualification
        run: python -m pytest -q tests/test_openappa_optional_compat.py
