# Cross-component suite delegated to its canonical testing repository.
name: W7 selected bounded reference release qualification
'on':
  pull_request:
    paths:
    - .github/workflows/w7-reference-release.yml
    - profiles/bounded-v1-reference-release-selection.json
    - tests/test_w7_reference_selection.py
    - docs/releases/w7-final-merged-c8-qualification.md
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--w7-reference-release.yml@47f28db6c27eb5c87263a3fbe5b866cd606c9016
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 47f28db6c27eb5c87263a3fbe5b866cd606c9016
    permissions:
      contents: read
