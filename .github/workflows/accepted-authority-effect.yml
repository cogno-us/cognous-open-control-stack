# Cross-component suite delegated to its canonical testing repository.
name: Accepted authority-effect Linux batches
'on':
  pull_request:
    paths:
    - tools/worker21_authority_effect_qualification.py
    - tests/test_worker21_atomic_authority_effect.py
    - tests/test_worker21_qualification_gate.py
    - .github/workflows/accepted-authority-effect.yml
    - docs/workstreams/accepted-authority-effect-checkpoint.md
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--accepted-authority-effect.yml@b93824aff2a338510af06a560657d7daec8d027a
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: b93824aff2a338510af06a560657d7daec8d027a
    permissions:
      contents: read
