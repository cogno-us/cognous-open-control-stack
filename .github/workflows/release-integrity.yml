# Cross-component suite delegated to its canonical testing repository.
name: Release source integrity
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--release-integrity.yml@b93824aff2a338510af06a560657d7daec8d027a
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: b93824aff2a338510af06a560657d7daec8d027a
    permissions:
      contents: read
