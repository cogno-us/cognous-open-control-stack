# Cross-component suite delegated to its canonical testing repository.
name: Release source integrity
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--release-integrity.yml@2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    permissions:
      contents: read
