# Cross-component suite delegated to its canonical testing repository.
name: Release source integrity
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--release-integrity.yml@f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    permissions:
      contents: read
