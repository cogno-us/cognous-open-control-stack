# Cross-component suite delegated to its canonical testing repository.
name: Release source integrity
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--release-integrity.yml@43fb81dc3ec0da17402bef274dcec1831cc5e160
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 43fb81dc3ec0da17402bef274dcec1831cc5e160
    permissions:
      contents: read
