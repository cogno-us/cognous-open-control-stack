# Cross-component suite delegated to its canonical testing repository.
name: Protected local worker qualification
'on':
  pull_request:
    paths:
    - component-lock.json
    - profiles/w7-bounded-v1-component-lock.candidate.json
    - tools/protected_qualification.py
    - tools/protected_worker.py
    - tests/test_protected_qualification.py
    - docs/protected-qualification.md
    - docs/workstreams/protected-qualification-checkpoint.md
    - .github/workflows/protected-qualification.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--protected-qualification.yml@2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: 2bb5f10d5d24df27cbf8bfeec0f91bf004c2505d
    permissions:
      contents: read
