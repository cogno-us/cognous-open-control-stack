name: Protected local worker qualification
on:
  pull_request:
    paths:
      - 'component-lock.json'
      - 'tools/protected_qualification.py'
      - 'tools/protected_worker.py'
      - 'tests/test_protected_qualification.py'
      - 'docs/protected-qualification.md'
      - 'docs/workstreams/protected-qualification-checkpoint.md'
      - '.github/workflows/protected-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install 'pytest>=8,<9' 'pydantic>=2,<3'
      - name: Record host profile without changing security policy
        run: |
          mkdir -p results/protected
          python - <<'PYHOST'
          import json, os, platform, subprocess
          from pathlib import Path
          paths = ['/etc/os-release', '/proc/sys/kernel/apparmor_restrict_unprivileged_userns', '/proc/sys/kernel/unprivileged_userns_clone', '/proc/self/attr/current']
          observed = {}
          for path in paths:
              try:
                  observed[path] = Path(path).read_text().strip()
              except OSError as exc:
                  observed[path] = {'unavailable': type(exc).__name__}
          Path('results/protected/host-profile.json').write_text(json.dumps({
              'runner_profile': 'ubuntu-22.04', 'platform': platform.platform(),
              'uid': os.getuid(), 'bubblewrap': subprocess.check_output(['bwrap', '--version'], text=True).strip(),
              'observed': observed, 'security_overrides': False}, indent=2))
          PYHOST
      - name: Prepare exact selected dependency checkouts
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.protected_qualification import checkouts
          checkouts(Path('.protected-work').resolve(), clone=True)
          PY
      - name: Verify harness failure handling and actual pinned adapter cases
        run: |
          mkdir -p results/protected
          python -m pytest -q tests/test_protected_qualification.py --junitxml=results/protected/verifier-tests.xml
      - name: Run protected campaign twice
        run: python tools/protected_qualification.py --results-dir results/protected/campaign
      - name: Upload evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-local-worker-evidence
          path: results/protected
          if-no-files-found: error
