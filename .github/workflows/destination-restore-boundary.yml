# Cross-component suite delegated to its canonical testing repository.
name: Destination restore boundary (S3 lane C)
'on':
  pull_request:
    paths:
    - reference_profiles/**
    - component-lock.json
    - profiles/**
    - tools/optional_execution*
    - tools/requirements-federated-governance.txt
    - tests/test_destination_restore_boundary.py
    - tests/test_protected_destination.py
    - docs/workstreams/destination-restore-boundary.md
    - .github/workflows/destination-restore-boundary.yml
  push:
    branches:
    - main
    paths:
    - reference_profiles/**
    - component-lock.json
    - tests/test_destination_restore_boundary.py
    - .github/workflows/destination-restore-boundary.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--destination-restore-boundary.yml@f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: f99bb7591f52ca5a26d64a50d9ef466b4749ad4e
    permissions:
      contents: read
