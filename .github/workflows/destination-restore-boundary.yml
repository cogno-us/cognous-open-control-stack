name: Destination restore boundary (S3 lane C)
on:
  pull_request:
    paths:
      - 'reference_profiles/**'
      - 'component-lock.json'
      - 'profiles/**'
      - 'tools/optional_execution*'
      - 'tools/requirements-federated-governance.txt'
      - 'tests/test_destination_restore_boundary.py'
      - 'tests/test_protected_destination.py'
      - 'docs/workstreams/destination-restore-boundary.md'
      - '.github/workflows/destination-restore-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'component-lock.json'
      - 'tests/test_destination_restore_boundary.py'
      - '.github/workflows/destination-restore-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  characterize:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      RESTORE_BOUNDARY_RESULTS: results/restore-cases
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements-federated-governance.txt 'pydantic>=2,<3'
      - name: Characterize actual destination and selected optional same-host C1
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source-revision.txt
          sha256sum component-lock.json reference_profiles/protected_destination.py tests/test_destination_restore_boundary.py > results/source-sha256.txt
          python -m pip freeze > results/dependencies.txt
          timeout 420s python -m pytest -q tests/test_destination_restore_boundary.py tests/test_protected_destination.py --junitxml=results/tests.xml
      - name: Hash retained evidence
        if: always()
        run: find results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: destination-restore-boundary-${{ matrix.python }}
          path: results/
          if-no-files-found: error
