name: Bounded research assurance
on:
  pull_request:
    paths:
      - 'reference_profiles/context_memory.py'
      - 'reference_profiles/context_journal.py'
      - 'reference_profiles/payload_disclosure.py'
      - 'reference_profiles/resolver_assurance.py'
      - 'reference_profiles/resolver_revision_ledger.py'
      - 'tests/test_research_assurance.py'
      - 'tests/test_resolver_assurance.py'
      - 'tests/test_context_memory_profile.py'
      - 'tools/research_assurance_mutations.py'
      - 'docs/workstreams/research-assurance-addenda.md'
      - '.github/workflows/research-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'tests/test_research_assurance.py'
      - 'tools/research_assurance_mutations.py'
      - '.github/workflows/research-assurance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10'
      - name: Actual local routes and regression tests
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source-revision.txt
          sha256sum component-lock.json > results/component-lock.sha256
          timeout 60s python -m pytest -q tests/test_research_assurance.py tests/test_resolver_assurance.py tests/test_context_memory_profile.py --junitxml=results/tests.xml
      - name: Detect removed controls
        shell: bash
        run: timeout 90s python tools/research_assurance_mutations.py | tee results/control-removal.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-assurance-${{ matrix.python }}
          path: results/
          if-no-files-found: error
