name: Reference release evidence
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run pinned reference candidate twice
        run: python tools/reference_release.py run --results-dir results/reference
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognous-open-control-stack-reference-evidence
          path: results/reference
          if-no-files-found: error
