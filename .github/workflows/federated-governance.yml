name: Federated governance addendum
on:
  pull_request:
    paths:
      - 'reference_profiles/assurance_runtime.py'
      - 'reference_profiles/federated_governance.py'
      - 'reference_profiles/trust_evidence.py'
      - 'tests/test_federated_governance.py'
      - 'tests/test_integrated_assurance.py'
      - 'tools/federated_governance*'
      - 'tools/requirements-federated-governance.txt'
      - 'docs/workstreams/federated-governance-addendum.md'
      - '.github/workflows/federated-governance.yml'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'tests/test_federated_governance.py'
      - 'tools/federated_governance*'
      - 'tools/requirements-federated-governance.txt'
      - '.github/workflows/federated-governance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements-federated-governance.txt
      - name: Qualify twice at exact source
        run: |
          python tools/federated_governance_qualification.py --results-dir results/first
          python tools/federated_governance_qualification.py --results-dir results/second
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: federated-governance-${{ matrix.python }}
          path: results/
          if-no-files-found: error
