# Cross-component suite delegated to its canonical testing repository.
name: Shared synthetic governance comparison
'on':
  pull_request:
    paths:
    - benchmarks/governance/**
    - benchmarks/__init__.py
    - tools/run_comparative_governance.py
    - tests/test_comparative_governance.py
    - reference_profiles/**
    - docs/workstreams/comparative-governance-battery.md
    - .github/workflows/comparative-governance.yml
  push:
    branches:
    - main
    paths:
    - benchmarks/**
    - tools/run_comparative_governance.py
    - tests/test_comparative_governance.py
    - reference_profiles/**
    - .github/workflows/comparative-governance.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  cross-component:
    uses: cogno-us/cognous-stack-qualification/.github/workflows/cognous-open-control-stack--comparative-governance.yml@b93824aff2a338510af06a560657d7daec8d027a
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      qualification_revision: b93824aff2a338510af06a560657d7daec8d027a
    permissions:
      contents: read
