name: Contract and candidate artifact verification
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    strategy:
      matrix:
        python:
        - '3.11'
        - '3.12'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Checkout canonical smoke harness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: cogno-us/cognous-stack-qualification
        ref: 39f038435afdd71ba162860faa5718d90d7bde64
        path: _qualification
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r tools/requirements-federated-governance.txt
    - name: Published contract drift and verifier negative controls
      run: 'python tools/check_contract_surfaces.py

        python -m unittest discover -s tests -p test_contract_artifact_verification.py -v

        '
    - name: Verify unpublished exact-source candidate and clean-extraction smoke
      shell: bash
      run: 'source_revision=$(git rev-parse HEAD)

        candidate="$RUNNER_TEMP/candidate.tar"

        git archive --format=tar --output="$candidate" "$source_revision"

        candidate_digest=$(sha256sum "$candidate" | cut -d '' '' -f 1)

        python tools/verify_candidate_archive.py "$candidate" --revision "$source_revision" --sha256 "$candidate_digest"
        --smoke --qualification-root _qualification --qualification-revision 39f038435afdd71ba162860faa5718d90d7bde64

        '
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
