name: Signed wire allocation bounds
on:
  pull_request:
    paths:
      - 'reference_profiles/**'
      - 'tests/test_wire_budget.py'
      - '.github/workflows/wire-budget.yml'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'tests/test_wire_budget.py'
      - '.github/workflows/wire-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r tools/requirements-release.lock
      - run: python -m pytest -q tests/test_wire_budget.py
