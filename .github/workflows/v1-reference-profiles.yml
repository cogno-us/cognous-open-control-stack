name: V1 reference extensions
on:
  pull_request:
    paths:
      - 'reference_profiles/**'
      - 'tools/reference_environment.py'
      - 'tools/v1_reference_profiles.py'
      - 'tests/test_reference_environment.py'
      - 'tests/test_context_memory_profile.py'
      - 'tests/test_institutional_review_profile.py'
      - 'tests/test_temporal_refund_profile.py'
      - 'component-lock.json'
      - '.github/workflows/v1-reference-profiles.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-reference-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: environment
            tests: tests/test_reference_environment.py
          - profile: governed-context
            tests: tests/test_context_memory_profile.py
          - profile: institutional-review
            tests: tests/test_institutional_review_profile.py
          - profile: temporal-refund
            tests: tests/test_temporal_refund_profile.py
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROFILE: ${{ matrix.profile }}
      TEST_FILE: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3'
      - name: Run reference profile
        shell: bash
        run: |
          mkdir -p results
          if [ "$PROFILE" = environment ]; then
            python tools/reference_environment.py --profile ordinary-bounded --storage-dir results > results/environment.json
          else
            python tools/v1_reference_profiles.py --profile "$PROFILE" --results-dir "results/$PROFILE"
          fi
      - name: Run bounded tests
        run: timeout 120s python -m pytest -q "$TEST_FILE" --junitxml=results/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-${{ matrix.profile }}
          path: results/
