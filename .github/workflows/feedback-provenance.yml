name: Feedback provenance contract
on:
  pull_request:
    paths:
      - 'reference_profiles/provenance_groups.py'
      - 'tests/test_provenance_groups.py'
      - 'docs/workstreams/feedback-provenance-groups.md'
      - '.github/workflows/feedback-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_provenance_groups.py -v
