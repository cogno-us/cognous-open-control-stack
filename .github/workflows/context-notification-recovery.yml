name: Context notification and recovery (manual diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: context-notification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: Linux / ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: context-action
            tests: tests/test_context_action_profile.py
          - profile: notification
            tests: tests/test_notification_profile.py
          - profile: recovery
            tests: tests/test_sqlite_recovery_profile.py
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PROFILE: ${{ matrix.profile }}
      TEST_FILE: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'pydantic>=2,<3'
      - name: Exercise selected integration
        shell: bash
        run: |
          mkdir -p results
          if [ "$PROFILE" != recovery ]; then
            python tools/bound_context_notification.py --profile "$PROFILE" --results-dir "results/$PROFILE"
          fi
      - name: Verify bounded integration and recovery
        run: timeout 120s python -m pytest -q "$TEST_FILE" --junitxml=results/tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: context-notification-${{ matrix.profile }}
          path: results/
