name: S0 nonselected merged-pin remediation candidate
on:
  pull_request:
    paths:
      - profiles/remediation-candidate-20261015.json
      - tools/remediation_candidate.py
      - tests/test_remediation_candidate.py
      - .github/workflows/remediation-candidate.yml
      - docs/verification/remediation-candidate-2026-10-15.md
      - docs/verification/s0-component-repair-2026-10-15.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked qualification dependencies
        run: python -m pip install --require-hashes -r tools/requirements-release.lock
      - name: Run two exact-pin repetitions (incompatibilities fail this gate)
        run: python tools/remediation_candidate.py --prepare-work --work .s1-work --out results/s1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s1-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: results/s1/
          if-no-files-found: error
