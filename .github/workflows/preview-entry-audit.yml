name: Preview entrypoint audit
on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/start-here.md'
      - 'docs/quickstart.md'
      - 'docs/governance-quickstart.md'
      - 'docs/release-status.md'
      - 'docs/preview-entry-audit.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tools/check_preview_entries.py'
      - 'tests/test_preview_negative_controls.py'
      - '.github/workflows/preview-entry-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Positive preview audit
        run: python tools/check_preview_entries.py
      - name: Guard-sensitive negative and mutation controls
        run: python -m unittest discover -s tests -p 'test_preview_negative_controls.py' -v
