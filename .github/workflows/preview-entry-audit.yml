name: Preview entrypoint audit
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Positive preview audit
        run: python tools/check_preview_entries.py
      - name: Guard-sensitive negative and mutation controls
        run: python -m unittest discover -s tests -p 'test_preview_negative_controls.py' -v
