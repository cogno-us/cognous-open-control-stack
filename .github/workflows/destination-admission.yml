name: Destination admission addendum
on:
  pull_request:
    paths:
      - 'reference_profiles/protected_destination.py'
      - 'reference_profiles/protocol_evaluation.py'
      - 'reference_profiles/assurance_runtime.py'
      - 'reference_profiles/operational_state.py'
      - 'reference_profiles/trust_evidence.py'
      - 'reference_profiles/federated_governance.py'
      - 'tests/test_federated_governance.py'
      - 'tests/test_protected_destination.py'
      - 'tests/test_protocol_evaluation.py'
      - 'tests/test_operational_state.py'
      - 'tests/test_integrated_assurance.py'
      - 'tools/destination_admission*'
      - 'tools/requirements-federated-governance.txt'
      - 'docs/workstreams/destination-admission-addendum.md'
      - '.github/workflows/destination-admission.yml'
  push:
    branches: [main]
    paths:
      - 'reference_profiles/**'
      - 'reference_profiles/federated_governance.py'
      - 'tests/test_federated_governance.py'
      - 'tests/test_protected_destination.py'
      - 'tests/test_protocol_evaluation.py'
      - 'tests/test_operational_state.py'
      - 'tools/destination_admission*'
      - 'tools/requirements-federated-governance.txt'
      - '.github/workflows/destination-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r tools/requirements-release.lock
      - name: Qualify twice at exact source
        run: |
          python tools/destination_admission_qualification.py --results-dir results/first
          python tools/destination_admission_qualification.py --results-dir results/second
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: destination-admission-${{ matrix.python }}
          path: results/
          if-no-files-found: error
