name: Deployment review packet
on:
  pull_request:
    paths:
      - 'tools/deployment_review.py'
      - 'tests/test_deployment_review.py'
      - 'examples/deployment-review/**'
      - '.github/workflows/deployment-review.yml'
      - 'docs/deployment-review-packet.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  packet-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Positive and negative packet checks
        timeout-minutes: 1
        run: python -m unittest discover -s tests -p test_deployment_review.py -v
