name: Embedding exposure evidence
on:
  pull_request:
    paths:
      - 'tools/verify_embedding_exposure.py'
      - 'tools/deployment_review.py'
      - 'tests/test_embedding_exposure.py'
      - 'examples/embedding-exposure-unverified.json'
      - '.github/workflows/embedding-exposure.yml'
  push:
    branches: [main]
    paths:
      - 'tools/verify_embedding_exposure.py'
      - 'tools/deployment_review.py'
      - 'tests/test_embedding_exposure.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exposure-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_embedding_exposure.py -v
      - run: python -m unittest discover -s tests -p test_deployment_review.py -v
